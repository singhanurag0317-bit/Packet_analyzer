name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_DIR: build

jobs:
  build-native:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Meson + Ninja
        run: pip install meson ninja

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Building without live capture in CI by default (live_capture=false).
          # Npcap SDK is only needed when -Dlive_capture=true is passed.
          Write-Host "Building without live capture (Dependency-free CI)"

      - name: Configure (Meson)
        run: meson setup ${{ env.BUILD_DIR }} -Dtests=true

      - name: Build
        run: meson compile -C ${{ env.BUILD_DIR }}

      - name: Run tests
        run: meson test -C ${{ env.BUILD_DIR }} --print-errorlogs

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.name }}
          path: ${{ env.BUILD_DIR }}/meson-logs/

  # Track A: live capture requires libpcap - build separately on Linux.
  build-live-capture:
    name: Build (Linux, live capture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Meson + Ninja
        run: pip install meson ninja

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Configure (with live capture)
        run: meson setup build -Dlive_capture=true

      - name: Build
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --print-errorlogs

  dashboard:
    name: Dashboard (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r dashboard/requirements.txt

      - name: Run dashboard pytest suite
        run: |
          python -m pytest dashboard/test_dashboard.py